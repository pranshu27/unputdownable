version: 0.2
 
phases:
 
    pre_build:
      commands:
        - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
        - echo $COMMIT_HASH
        - IMAGE_TAG="${COMMIT_HASH}"
        - CURRENT_DATE=$(date +"%d-%m-%y")
        - echo $CURRENT_DATE
        - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
        - echo $COMMIT_HASH
        - echo $CODEBUILD_BUILD_NUMBER
        - IMAGE_TAG="${COMMIT_HASH}-${CODEBUILD_BUILD_NUMBER}"
        - echo $IMAGE_TAG
 
    build:
      commands:
        - echo Logging in to Amazon ECR...
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
        - docker compose build
        - docker images
        - docker tag $IMAGE_REPO_NAME:latest $ECR_REPOSITORY_URI:latest
        - docker tag $IMAGE_REPO_NAME:latest $ECR_REPOSITORY_URI:$IMAGE_TAG
        - docker images
 
    post_build:
      commands:
        - echo Pushing the Docker image...
        - docker push $ECR_REPOSITORY_URI:latest
        - docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
        - DOCKER_CONTAINER_NAME=xcompanion-jnj-container
        - printf '[{"name":"%s","imageUri":"%s"}]' $DOCKER_CONTAINER_NAME $ECR_REPOSITORY_URI:latest > imagedefinitions.json
        - echo $DOCKER_CONTAINER_NAME
        - cat imagedefinitions.json
artifacts:
  files:
        - 'imagedefinitions.json'