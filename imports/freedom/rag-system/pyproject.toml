[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
version = "0.1.0"
description = "Standalone RAG service over Informatica PowerCenter XML exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "langgraph>=0.2.30",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "networkx>=3.2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
eval = [
    "ragas>=0.4.3",
    "datasets>=5.0.0",
    "langchain-community<0.4",
]
ui = [
    "streamlit>=1.37",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
