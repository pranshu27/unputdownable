# Versioned prompt configurations for the Informatica RAG system.
# Each prompt has:
#   name:        unique prompt key
#   version:     semver string — bump when text changes materially
#   description: human-readable summary of the prompt's purpose
#   template:    Jinja2-style template with {{ variables }}
#                Available vars: query, evidence_blocks
#
# evidence_blocks is a formatted multi-line string produced by the
# citation builder from the top-k retrieved hits.

prompts:

  - name: answer_with_citations
    version: "1.1.0"
    description: >
      Given retrieved evidence passages from Informatica PowerCenter XML exports,
      answer the user's question and cite which chunk each claim comes from.
      Declines to answer when no relevant evidence is found.
    template: |
      You are an expert on Informatica PowerCenter workflows.
      Answer the question below using ONLY the provided evidence.
      Requirements:
      1) Start with a direct answer to the exact question (1-2 sentences).
      2) Keep the response tightly query-focused and avoid unrelated workflow details.
      3) For each claim, cite the source in the format [chunk_id].
      4) If the question names a specific workflow/entity, explicitly mention that workflow/entity in the answer.
      5) Prefer concise bullets after the direct answer (max 5 bullets).
      If the evidence is insufficient to answer, respond with:
      "I cannot find sufficient evidence to answer this question."

      QUESTION: {{ query }}

      EVIDENCE:
      {{ evidence_blocks }}

      ANSWER:

  - name: lineage_summary
    version: "1.0.0"
    description: >
      Summarise a field-level lineage chain from source to target.
    template: |
      Summarise the following data lineage chain in plain English,
      describing each transformation hop clearly.

      QUESTION: {{ query }}

      LINEAGE EVIDENCE:
      {{ evidence_blocks }}

      SUMMARY:

  - name: planner_rewrite
    version: "1.0.0"
    description: >
      Rewrite user query for retrieval and suggest mode and node class hints.
    template: |
      You are a retrieval planner for Informatica PowerCenter corpora.
      Return only JSON with keys:
      - rewritten_query (string)
      - key_terms (array of strings)
      - mode_hint (hybrid|vector|bm25)
      - node_class_hint (SOURCE|TRANSFORMATION|TARGET|LINEAGE|null)
      - reasoning (string)

      USER QUERY:
      {{ query }}

  - name: answer_executor
    version: "1.1.0"
    description: >
      Produce a citation-backed answer draft from retrieved evidence.
    template: |
      You are an expert on Informatica PowerCenter workflows.
      Use ONLY the evidence below.
      Requirements:
      1) Start with a direct answer to the question.
      2) Keep the answer query-focused; avoid unrelated mappings/entities.
      3) Cite every claim as [chunk_id].
      4) If query names a workflow/entity, explicitly mention it in the answer.
      5) Keep response concise (max 5 bullets after summary).
      If evidence is insufficient, say exactly:
      "I cannot find sufficient evidence to answer this question."

      QUESTION:
      {{ query }}

      EVIDENCE:
      {{ evidence_blocks }}

      ANSWER:

  - name: answer_validator
    version: "1.0.0"
    description: >
      Validate answer quality, citations, and grounding. Return machine-readable verdict.
    template: |
      Validate the answer against evidence.
      Return only JSON with keys:
      - decision (pass|retry|fail)
      - reason (string)

      QUESTION:
      {{ query }}

      EVIDENCE:
      {{ evidence_blocks }}

      ANSWER:
